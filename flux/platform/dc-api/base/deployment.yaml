apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-api
  namespace: dc-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dc-api
  template:
    metadata:
      labels:
        app: dc-api
    spec:
      serviceAccountName: dc-api
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: dc-api
          # Marker for Flux Image Automation Controller — auto-bumped on
          # new ghcr.io/<owner>/dc-api tags matching the ImagePolicy.
          image: ghcr.io/wso2/dc-api:v0.9.0 # {"$imagepolicy": "flux-system:dc-api"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: dc-api-config
            - secretRef:
                name: dc-api-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
