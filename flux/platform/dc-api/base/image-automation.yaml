# Flux Image Automation: watches the dc-api image registry and bumps the
# Deployment's image tag on new releases.
#
# Dev envs: auto-commit to main (instant rollout).
# Prod envs: change to push.refspec for PR-gated bumps.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: dc-api
  namespace: flux-system
spec:
  # Placeholder — overlay patches to ghcr.io/<owner>/dc-api.
  image: ghcr.io/wso2/dc-api
  interval: 5m
  # Pull credentials for scanning private GHCR packages. The wizard's
  # --seal-secrets path drops this Secret into flux-system.
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: dc-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: dc-api
  # Accepts both bare 40-char commit SHAs (today's wso2 CI tag format) and
  # `main-<short-sha>` (Flux-native semver-ish alternative used by some
  # downstream forks). Override in your overlay if your CI tags differently.
  filterTags:
    pattern: '^(?P<sha>[a-f0-9]{7,40})$'
    extract: '$sha'
  policy:
    alphabetical:
      order: asc
