# cert-manager Issuer + Certificate for the webhook's server cert.
# cert-manager's cainjector populates the MutatingWebhookConfiguration's
# caBundle automatically via the `cert-manager.io/inject-ca-from`
# annotation — see mutatingwebhookconfiguration.yaml.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dc-api-webhook-selfsigned
  namespace: dc-webhook
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dc-api-webhook
  namespace: dc-webhook
spec:
  secretName: dc-api-webhook-tls
  duration: 87600h     # 10y
  renewBefore: 720h    # 30d
  issuerRef:
    name: dc-api-webhook-selfsigned
    kind: Issuer
  commonName: dc-api-webhook.dc-webhook.svc
  dnsNames:
    - dc-api-webhook
    - dc-api-webhook.dc-webhook
    - dc-api-webhook.dc-webhook.svc
    - dc-api-webhook.dc-webhook.svc.cluster.local
  usages:
    - server auth
    - key encipherment
    - digital signature
