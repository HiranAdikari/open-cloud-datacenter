---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: cloud-ui
  namespace: flux-system
spec:
  image: ghcr.io/wso2/cloud-ui
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: cloud-ui
  namespace: flux-system
spec:
  imageRepositoryRef: { name: cloud-ui }
  filterTags:
    pattern: '^main-(?P<sha>[a-f0-9]{7,})$'
    extract: '$sha'
  policy:
    alphabetical: { order: asc }
