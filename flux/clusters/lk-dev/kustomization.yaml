apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# lk-dev env overlay. Reference env for the spike.

resources:
  - ../../platform
  # Sealed secrets the wizard generates land here:
  # - sealed-asgardeo-m2m.yaml
  # - sealed-rancher-token.yaml
  # - sealed-harvester-kubeconfig.yaml
  # - sealed-ghcr-pull.yaml
  # - sealed-dc-api.yaml

patches:
  - target:
      kind: ConfigMap
      name: dc-api-config
    patch: |-
      - op: replace
        path: /data/DCAPI_OIDC_ISSUER
        value: "https://api.asgardeo.io/t/hiranadikari/oauth2/token"
      - op: replace
        path: /data/DCAPI_RANCHER_URL
        value: "https://rancher-lk-dev.wso2.com"
      - op: replace
        path: /data/DCAPI_BFF_REDIRECT_URL
        value: "https://dcapi.lk-dev.internal.wso2.com/v1/auth/callback"
      - op: replace
        path: /data/DCAPI_BFF_POST_LOGIN_REDIRECT
        value: "https://cloud.lk-dev.internal.wso2.com/"
      - op: replace
        path: /data/DCAPI_BFF_POST_LOGOUT_REDIRECT
        value: "https://cloud.lk-dev.internal.wso2.com/"
      - op: replace
        path: /data/DCAPI_BFF_COOKIE_DOMAIN
        value: ".lk-dev.internal.wso2.com"
      - op: replace
        path: /data/DCAPI_VPC_EXTERNAL_BRIDGE
        value: "mgmt-br"
      - op: replace
        path: /data/DCAPI_VPC_EXTERNAL_CIDR
        value: "192.168.10.0/24"
      - op: replace
        path: /data/DCAPI_VPC_EXTERNAL_GATEWAY
        value: "192.168.10.254"

  - target:
      kind: Ingress
      name: dc-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "dcapi.lk-dev.internal.wso2.com"
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "dcapi.lk-dev.internal.wso2.com"

  - target:
      kind: ImageRepository
      name: dc-api
    patch: |-
      - op: replace
        path: /spec/image
        value: "ghcr.io/hiranadikari/dc-api"
